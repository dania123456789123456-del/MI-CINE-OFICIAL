<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reportes de Guardia — Panel administrativo</title>
<meta name="description" content="Panel administrativo de reportes de guardia: personal, unidades, control horario, evidencias, revisiones y conceptos administrativos." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
/* =========================================================
   DISEÑO LIQUID GLASS — variables centrales
   ========================================================= */
:root{
  --bg:#07070a; --bg2:#121217;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12);
  --glass-solid:rgba(24,24,30,.94);
  --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.08);
  --hi:rgba(255,255,255,.35);
  --text:#f4f4f6; --muted:#a3a3ad; --dim:#6e6e78;
  --red:#ff3b47; --red-soft:rgba(255,59,71,.16); --red-glow:rgba(255,59,71,.45);
  --ok:#34d27b; --ok-soft:rgba(52,210,123,.15);
  --warn:#ffb13b; --warn-soft:rgba(255,177,59,.15);
  --info:#5ab4ff; --info-soft:rgba(90,180,255,.15);
  --radius:20px; --radius-sm:12px;
  --shadow:0 20px 50px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
  --bg-url:none;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-d:"Sora","Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
   radial-gradient(1200px 700px at 85% -10%,rgba(255,59,71,.22),transparent 60%),
   radial-gradient(900px 600px at -10% 110%,rgba(255,255,255,.07),transparent 60%),
   linear-gradient(160deg,#0b0b0f,#050507 60%,#0f0a0b);}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:var(--bg-url);background-size:cover;background-position:center;opacity:.55;filter:saturate(.9)}
body.has-bg::before{opacity:.6}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  backdrop-filter:blur(26px) saturate(160%);position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.14),transparent 35%,transparent 70%,rgba(255,255,255,.04));mix-blend-mode:screen}
@supports not (backdrop-filter:blur(1px)){ .glass{background:var(--glass-solid)} }

/* Layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:18px;display:flex;flex-direction:column;gap:10px}
.side-inner{height:100%;display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--red),#a3121b);box-shadow:0 8px 24px -6px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.4)}
.brand b{font-family:var(--font-d);font-size:15px;display:block}
.brand small{color:var(--muted);font-size:11px}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:12px 10px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:12px;cursor:pointer;color:var(--muted);text-align:left;transition:.2s}
.nav-btn svg{width:17px;height:17px}
.nav-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.nav-btn.active{background:linear-gradient(90deg,var(--red-soft),rgba(255,255,255,.04));color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,59,71,.35)}
.nav-btn.active svg{color:var(--red)}
.nav-btn .count{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.main{padding:22px 26px 100px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:20px;position:sticky;top:12px;z-index:20}
.topbar h1{font-size:19px}
.topbar .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
.mode-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.mode-pill.demo{color:var(--warn);background:var(--warn-soft);border-color:rgba(255,177,59,.4)}
.mode-pill.live{color:var(--ok);background:var(--ok-soft);border-color:rgba(52,210,123,.4)}
.mode-pill i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

/* Mobile nav */
.mobile-nav{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:12px 12px 110px}
  .topbar{top:8px;padding:10px 12px}
  .topbar .user-chip{display:none}
  .mobile-nav{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;padding:6px;justify-content:space-around;border-radius:24px}
  .mobile-nav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 2px;border-radius:16px;cursor:pointer}
  .mobile-nav button svg{width:20px;height:20px}
  .mobile-nav button.active{color:var(--text);background:var(--red-soft)}
  .mobile-nav button.active svg{color:var(--red)}
}

/* Components */
.grid{display:grid;gap:16px}
.g-stats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g-2{grid-template-columns:1.4fr 1fr}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:980px){.g-2{grid-template-columns:1fr}.g-stats{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{padding:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px}
.card-h .muted{font-size:12px}
.stat{padding:16px;cursor:pointer;transition:.25s}
.stat:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.stat .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);margin-bottom:12px}
.stat .ico svg{width:17px;height:17px}
.stat .ico.r{background:var(--red-soft);color:var(--red)}
.stat .val{font-family:var(--font-d);font-size:28px;font-weight:700}
.stat .lbl{color:var(--muted);font-size:12px}
.demo-tag{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(255,177,59,.35);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.07);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px;transition:.2s;white-space:nowrap;color:var(--text)}
.btn svg{width:16px;height:16px}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.primary{background:linear-gradient(180deg,#ff4d58,#d71d2a);border-color:rgba(255,120,128,.6);box-shadow:0 8px 22px -8px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.35);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:#ff7d85;border-color:rgba(255,59,71,.4);background:var(--red-soft)}
.btn.ok{color:var(--ok);border-color:rgba(52,210,123,.4);background:var(--ok-soft)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.06);width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field .hint{font-size:11px;color:var(--dim)}
.field .err{font-size:11.5px;color:#ff7d85;display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;padding:9px 11px;outline:none;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:rgba(255,59,71,.7);box-shadow:0 0 0 3px rgba(255,59,71,.15)}
select option{background:#16161b}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--red)}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;color:var(--dim)}
.search input{padding-left:34px}
.toolbar select,.toolbar input[type=date]{width:auto;min-width:130px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}

.table-wrap{overflow:auto;border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--text)}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.03)}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:11.5px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:linear-gradient(145deg,#3a3a44,#1d1d24);border:1px solid var(--line);overflow:hidden;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:88px;height:88px;font-size:28px}
.avatar.xl{width:120px;height:120px;font-size:36px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-soft);border-color:rgba(52,210,123,.3)}
.b-warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(255,177,59,.3)}
.b-red{color:#ff7d85;background:var(--red-soft);border-color:rgba(255,59,71,.35)}
.b-info{color:var(--info);background:var(--info-soft);border-color:rgba(90,180,255,.3)}
.b-mute{color:var(--muted)}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--dim);margin-bottom:8px}
.tabs{display:flex;gap:4px;overflow:auto;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line-soft);margin-bottom:14px;scrollbar-width:none}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.tab.active{background:rgba(255,255,255,.12);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-item:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--red);box-shadow:0 0 8px var(--red-glow)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick .btn{justify-content:center;padding:14px 10px;flex-direction:column;white-space:normal;text-align:center}
.quick .btn svg{width:22px;height:22px;color:var(--red)}
.chart-box{position:relative;height:240px}

/* Unidades / agentes cards */
.ucard{padding:16px;display:flex;flex-direction:column;gap:10px}
.ucard h4{font-size:15px}
.ucard .row{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.ucard .row svg{width:14px;height:14px}
.acard{padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.2s}
.acard:hover{border-color:rgba(255,255,255,.28);transform:translateY(-1px)}

/* Control horario */
.slots{display:grid;grid-template-columns:repeat(12,minmax(54px,1fr));gap:5px}
.slot{border:1px solid var(--line);border-radius:9px;padding:6px 2px;text-align:center;font-size:10.5px;cursor:pointer;background:rgba(255,255,255,.04);transition:.15s;line-height:1.2}
.slot:hover{transform:scale(1.05)}
.slot b{display:block;font-size:11px}
.s-Pendiente{color:var(--muted)}
.s-Recibido{background:var(--info-soft);border-color:rgba(90,180,255,.4);color:var(--info)}
.s-En\ revisión{background:var(--warn-soft);border-color:rgba(255,177,59,.4);color:var(--warn)}
.s-Justificado{background:rgba(180,140,255,.14);border-color:rgba(180,140,255,.4);color:#c9b2ff}
.s-Aceptado{background:var(--ok-soft);border-color:rgba(52,210,123,.4);color:var(--ok)}
.s-Incumplimiento{background:var(--red-soft);border-color:rgba(255,59,71,.5);color:#ff7d85}
.s-late{box-shadow:inset 0 0 0 1px rgba(255,59,71,.5)}
.ctrl-row{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
@media (max-width:980px){.ctrl-row{grid-template-columns:1fr}.slots{grid-template-columns:repeat(6,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line);display:inline-block}

/* Evidencias */
.ev{overflow:hidden;display:flex;flex-direction:column}
.ev .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#1c1c22,#0d0d11);display:grid;place-items:center;position:relative;color:var(--dim);border-bottom:1px solid var(--line-soft)}
.ev .thumb svg{width:38px;height:38px}
.ev .thumb .tag{position:absolute;top:8px;left:8px}
.ev .thumb .sel{position:absolute;top:8px;right:8px}
.ev .body{padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.ev.selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,59,71,.35),var(--shadow)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.overlay.open{display:flex}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(22,22,28,.82);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.lg{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.modal-h h3{font-size:16px;flex:1}
.modal-b{padding:18px;overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#confirmOv{z-index:120}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (max-width:640px){.overlay{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;max-height:92vh}}

/* Toast */
#toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:pop .25s;background:rgba(24,24,30,.9);font-size:13px}
.toast svg{width:18px;flex:none}
.toast.ok svg{color:var(--ok)} .toast.err svg{color:var(--red)} .toast.info svg{color:var(--warn)}

/* Loading */
.loading{display:flex;align-items:center;gap:10px;justify-content:center;padding:50px;color:var(--muted)}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--red);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.view{animation:fade .3s}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:11px;color:var(--dim);text-align:center;text-transform:uppercase;padding:4px}
.cal .day{min-height:86px;border:1px solid var(--line-soft);border-radius:12px;padding:6px;background:rgba(255,255,255,.03);cursor:pointer;font-size:11px;overflow:hidden}
.cal .day:hover{border-color:var(--line)}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--red)}
.cal .day .n{font-weight:700;font-size:12px;margin-bottom:4px}
.cal .ev-chip{display:block;border-radius:6px;padding:2px 5px;margin-bottom:3px;background:var(--red-soft);color:#ffb2b7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev-chip.t1{background:var(--info-soft);color:var(--info)}
.cal .ev-chip.t2{background:var(--warn-soft);color:var(--warn)}
@media (max-width:640px){.cal .day{min-height:58px}.cal .ev-chip{font-size:0;height:5px;padding:0}}

.bg-preview{height:160px;border-radius:14px;border:1px dashed var(--line);background:#0b0b0f center/cover no-repeat;display:grid;place-items:center;color:var(--dim)}
.notice{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,177,59,.35);background:var(--warn-soft);color:#ffd59a;font-size:12.5px;display:flex;gap:10px}
.notice svg{width:18px;flex:none}
.notice.red{border-color:rgba(255,59,71,.35);background:var(--red-soft);color:#ffc0c4}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:12px}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-title h2{font-size:17px}
.photo-pick{display:flex;gap:16px;align-items:center}

/* Export stage (documento claro para PDF/PNG) */
#exportStage{position:fixed;left:-12000px;top:0;width:794px;background:#fff;color:#111;font-family:var(--font);z-index:-5}
.doc{padding:44px 48px;background:#fff;color:#141414;font-size:12px;width:794px}
.doc .dh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #d71d2a;padding-bottom:12px;margin-bottom:18px}
.doc h1{font-size:20px;color:#111}
.doc .tag{font-size:10px;color:#d71d2a;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.doc table{font-size:11px;margin:8px 0 14px}
.doc th{color:#555;border-bottom:1px solid #ccc;padding:6px}
.doc td{border-bottom:1px solid #eee;padding:6px;color:#222}
.doc .agent{display:flex;gap:16px;align-items:center;background:#f5f5f6;border-radius:10px;padding:12px;margin-bottom:14px}
.doc .ph{width:72px;height:72px;border-radius:10px;background:#ddd;display:grid;place-items:center;font-size:24px;font-weight:700;color:#555;overflow:hidden}
.doc .ph img{width:100%;height:100%;object-fit:cover}
.doc .tot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}

<script>
/* =====================================================================
   1. CONFIGURACIÓN CENTRAL
   Completa estos campos cuando el backend esté listo. NO coloques aquí
   tokens de Telegram ni contraseñas: esos secretos deben vivir únicamente
   en Google Apps Script (PropertiesService).
   ===================================================================== */
const APP_CONFIG = {
  appName: "Reportes de Guardia",
  backgroundImageUrl: "",      // URL de imagen de fondo (opcional)
  googleAppsScriptUrl: "",     // URL del despliegue Web App de Apps Script (…/exec)
  googleSheetsId: "",          // ID de la hoja de cálculo (lo usa el backend)
  telegramBotUsername: "",     // @usuario del bot (solo referencia visible, sin token)
  driveFolderId: "",           // ID de carpeta de Drive para fotografías/documentos
  defaultPhotoUrl: "",         // Foto por defecto para agentes sin fotografía
  useDemoData: true,           // true = modo demostración (datos ficticios locales)
  timezone: "America/Lima",
  currency: "PEN",
  shifts: { D: { name: "Diurno", start: 7, count: 12 }, N: { name: "Nocturno", start: 19, count: 12 } }
};
const CONFIG_KEY = "rg_config_v1", STATE_KEY = "rg_demo_state_v1";
let CURRENT_USER = "Supervisor (demo)"; // En modo conectado: nombre devuelto por el servidor tras iniciar sesión.
const isLive = () => !APP_CONFIG.useDemoData;
const HIDDEN_LIVE = ["conceptos","calendario","exportar"]; // fuera del control de reportes (no se borran: solo se ocultan)
const LIVE = { desde:"", hasta:"" };
const SESSION = {
  get token(){ try{ return sessionStorage.getItem("rg_tok")||""; }catch(e){ return ""; } },
  get name(){ try{ return sessionStorage.getItem("rg_usr")||""; }catch(e){ return ""; } },
  get rol(){ try{ return sessionStorage.getItem("rg_rol")||""; }catch(e){ return ""; } },
  set(t,n,r){ try{ sessionStorage.setItem("rg_tok",t); sessionStorage.setItem("rg_usr",n); sessionStorage.setItem("rg_rol",r); }catch(e){} CURRENT_USER=n; },
  clear(){ try{ sessionStorage.removeItem("rg_tok"); sessionStorage.removeItem("rg_usr"); sessionStorage.removeItem("rg_rol"); }catch(e){} }
};

(function loadConfig(){ try{ const s = JSON.parse(localStorage.getItem(CONFIG_KEY)||"null"); if(s) Object.assign(APP_CONFIG, s, {shifts: Object.assign({}, APP_CONFIG.shifts, s.shifts||{})}); }catch(e){} })();
function saveConfigLocal(){ try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(APP_CONFIG)); }catch(e){} }

/* =====================================================================
   2. UTILIDADES
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const uid = p => p + "-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const ic = (n, cls="") => `<i data-lucide="${n}" class="${cls}"></i>`;
function nowLima(){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:APP_CONFIG.timezone,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, hour:+p.hour%24, min:+p.minute };
}
const today = () => nowLima().date;
function addDays(d,n){ const t=new Date(d+"T12:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return "—"; const [y,m,dd]=d.slice(0,10).split("-"); return `${dd}/${m}/${y}`; }
function fmtDT(iso){ if(!iso) return "—"; try{ return new Intl.DateTimeFormat("es-PE",{timeZone:APP_CONFIG.timezone,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso)); }catch(e){ return iso; } }
function limaISO(date,h,m=0){ return new Date(`${date}T${pad(h)}:${pad(m)}:00-05:00`).toISOString(); }
function money(v){ if(v==null||v==="") return "—"; try{ return new Intl.NumberFormat("es-PE",{style:"currency",currency:APP_CONFIG.currency||"PEN"}).format(+v); }catch(e){ return (+v).toFixed(2); } }
function isValidUrl(u){ try{ const x=new URL(u); return x.protocol==="https:"||x.protocol==="http:"; }catch(e){ return false; } }
function slugify(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,""); }
function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function slotsFor(shift){
  const c = APP_CONFIG.shifts[shift]; if(!c) return [];
  return Array.from({length:c.count},(_,i)=>{ const h=(c.start+i)%24; return { idx:i, hour:h, label:`${pad(h)}:00–${pad((h+1)%24)}:00`, nextDay: c.start+i>=24 }; });
}
function slotEnd(iv){ const s=slotsFor(iv.shift)[iv.idx]; if(!s) return 0; const d = s.nextDay? addDays(iv.opDate,1): iv.opDate; return new Date(`${d}T${pad(s.hour)}:59:59-05:00`).getTime(); }
const shiftName = s => APP_CONFIG.shifts[s]?.name || s || "—";

/* =====================================================================
   3. ESTADO Y DATOS DE DEMOSTRACIÓN (ficticios, reemplazables)
   ===================================================================== */
let S = null;
const IV_STATES = ["Pendiente","Recibido","En revisión","Justificado","Aceptado","Incumplimiento confirmado"];
const CONCEPT_TYPES = ["Falta de reporte por hora","Turno no laborado","Ausencia","Memorando","Papeleta","Incidencia administrativa","Daño o pérdida de bienes","Otro concepto"];
const C_STATES = ["Pendiente","Autorizado","Rechazado","Anulado"];
const CAL_TYPES = ["Feriado","Servicio especial","Reporte diurno obligatorio","Cambio temporal de horario","Excepción aprobada","Observación del servicio"];

function seedDemo(){
  const r = rng(42), t = today();
  const units = [
    {id:"U-001",name:"Unidad Demo Norte",address:"Dirección de ejemplo 101",supervisor:"Supervisor Demo A",active:true,shifts:["D","N"],notes:"Registro ficticio de demostración."},
    {id:"U-002",name:"Unidad Demo Centro",address:"Dirección de ejemplo 202",supervisor:"Supervisor Demo B",active:true,shifts:["D","N"],notes:""},
    {id:"U-003",name:"Unidad Demo Sur",address:"Dirección de ejemplo 303",supervisor:"Supervisor Demo C",active:true,shifts:["D"],notes:"Solo turno diurno."},
    {id:"U-004",name:"Unidad Demo Este",address:"Dirección de ejemplo 404",supervisor:"Supervisor Demo D",active:false,shifts:["D","N"],notes:"Unidad desactivada (ejemplo)."}
  ];
  const names = [["Agente","Demo Uno"],["Agente","Demo Dos"],["Agente","Demo Tres"],["Agente","Demo Cuatro"],["Agente","Demo Cinco"],["Agente","Demo Seis"],["Agente","Demo Siete"],["Agente","Demo Ocho"],["Agente","Demo Nueve"],["Agente","Demo Diez"]];
  const agents = names.map((n,i)=>{
    const unitId = units[i%3].id, shift = (i%3===2)?"D":(i%2?"N":"D");
    const start = addDays(t,-(200+i*37));
    return { id:`A-${pad(i+1)}0`, first:n[0], last:n[1], dni:`0000000${i}`.slice(-8), phone:"", photoUrl:"", photoLocal:"",
      status: i===9?"Inactivo":(i===8?"Licencia":"Activo"), unitId, shift, start, notes:"Registro ficticio.",
      assignments:[{unitId:units[(i+1)%3].id,shift:shift==="D"?"N":"D",from:start,to:addDays(t,-60)},{unitId,shift,from:addDays(t,-59),to:null}] };
  });
  S = { units, agents, intervals:{}, evidences:[], concepts:[], calendar:[], audit:[], docs:[] };
  const nl = nowLima();
  for(let d=-6; d<=0; d++){
    const date = addDays(t,d);
    agents.filter(a=>a.status==="Activo").forEach(a=>{
      slotsFor(a.shift).forEach(s=>{
        const iv = mkInterval(date,a,s.idx);
        const ended = slotEnd(iv) < Date.now();
        if(!ended) return;
        const x = r();
        if(x<.72){ const ev = mkEvidence(a,iv, r); ev.slotKey=iv.key; ev.status="Asignada"; iv.evidenceId=ev.id; iv.status = d<0? "Aceptado":"Recibido"; }
        else if(x<.8){ iv.status="Justificado"; iv.justification={text:"Justificación de ejemplo (falla de señal).",status:"Aprobada",by:CURRENT_USER,at:limaISO(date,s.hour,40)}; }
        else if(x<.86){ iv.status="En revisión"; iv.notes.push({by:CURRENT_USER,at:new Date().toISOString(),text:"Foto poco legible (ejemplo)."}); const ev=mkEvidence(a,iv,r); ev.slotKey=iv.key; ev.status="Asignada"; iv.evidenceId=ev.id; }
        else if(x<.9 && d<-1){ iv.status="Incumplimiento confirmado"; }
        else if(x<.94){ iv.justification={text:"El agente indica que el celular se quedó sin batería (ejemplo).",status:"Pendiente",by:"Agente",at:limaISO(date,s.hour,50)}; }
      });
    });
  }
  // Lote: un agente envía 5 fotos juntas sin asignar
  const ag = agents[0], date = addDays(t,-1);
  const pend = Object.values(S.intervals).filter(i=>i.agentId===ag.id && i.opDate===date && i.status==="Pendiente");
  const base = slotsFor(ag.shift)[11];
  for(let k=0;k<5;k++){
    S.evidences.push({ id:`EV-L${k+1}`, agentId:ag.id, unitId:ag.unitId, shift:ag.shift, opDate:date, slotKey:null,
      receivedAt: limaISO(base.nextDay?addDays(date,1):date, base.hour, 20+k), type:k===4?"Video":"Fotografía",
      gps:"-12.0000, -77.0000 (ejemplo)", address:"Dirección aproximada de ejemplo", status:"Sin asignar", notes:"Recibidas en lote (demo).", telegramRef:"", demo:true });
  }
  if(pend.length<5){ /* asegurar intervalos pendientes para el escenario */ slotsFor(ag.shift).slice(0,5).forEach(s=>{ const iv=S.intervals[`${date}|${ag.id}|${s.idx}`]||mkInterval(date,ag,s.idx); if(!iv.evidenceId){ iv.status="Pendiente"; iv.justification=null; } }); }
  // Conceptos
  const cdefs = [
    [1,"Memorando",null,"Pendiente","Llegada tardía al relevo (ejemplo)."],
    [2,"Papeleta",null,"Autorizado","Uniforme incompleto (ejemplo)."],
    [0,"Falta de reporte por hora",null,"Pendiente","Intervalo sin evidencia confirmado (ejemplo, importe por definir)."],
    [3,"Daño o pérdida de bienes",50,"Pendiente","Linterna extraviada (ejemplo)."],
    [4,"Incidencia administrativa",null,"Autorizado","Incidencia registrada para ejemplo."],
    [5,"Ausencia",30,"Rechazado","Ausencia justificada posteriormente (ejemplo)."],
    [0,"Turno no laborado",80,"Autorizado","Ejemplo con importe ficticio."],
    [6,"Otro concepto",null,"Anulado","Registro anulado por error de digitación (ejemplo)."]
  ];
  cdefs.forEach((c,i)=>{ const a=agents[c[0]]; const fd=addDays(t,-(i*3+1));
    S.concepts.push({ id:`C-${pad(i+1)}00`, agentId:a.id, unitId:a.unitId, type:c[1], factDate:fd, regDate:fd, docNo:c[1]==="Memorando"?`MEM-DEMO-${pad(i+1)}`:(c[1]==="Papeleta"?`PAP-DEMO-${pad(i+1)}`:""),
      desc:c[4], reason:"Motivo de ejemplo.", amount:c[2], currency:APP_CONFIG.currency, attachment:"", createdBy:CURRENT_USER,
      authBy: c[3]!=="Pendiente"?CURRENT_USER:"", status:c[3], notes:"", decisionDate: c[3]!=="Pendiente"?limaISO(fd,15):"",
      history:[{at:limaISO(fd,10),by:CURRENT_USER,text:"Registro creado"}].concat(c[3]!=="Pendiente"?[{at:limaISO(fd,15),by:CURRENT_USER,text:`Estado cambiado a ${c[3]}`}]:[]) }); });
  S.calendar = [
    {id:"CAL-1",date:addDays(t,3),unitId:"all",type:"Feriado",desc:"Feriado de ejemplo (configurable)",mandatoryDay:true},
    {id:"CAL-2",date:addDays(t,6),unitId:"U-002",type:"Servicio especial",desc:"Evento especial de ejemplo",mandatoryDay:true},
    {id:"CAL-3",date:addDays(t,-2),unitId:"U-001",type:"Cambio temporal de horario",desc:"Ingreso 06:00 (ejemplo)",mandatoryDay:false}
  ];
  S.docs = [{id:"DOC-1",agentId:agents[1].id,name:"Constancia_demo.pdf",date:addDays(t,-20),note:"Documento ficticio (no existe archivo)"}];
  audit("Sistema","Datos de demostración generados","—","Se crearon registros ficticios.");
}
function mkInterval(date,a,idx){ const key=`${date}|${a.id}|${idx}`; if(S.intervals[key]) return S.intervals[key];
  const iv = {key, opDate:date, agentId:a.id, unitId:a.unitId, shift:a.shift, idx, status:"Pendiente", evidenceId:null, justification:null, notes:[], history:[]};
  S.intervals[key]=iv; return iv; }
function mkEvidence(a,iv,r){ const s=slotsFor(iv.shift)[iv.idx]; const d=s.nextDay?addDays(iv.opDate,1):iv.opDate;
  const ev = { id:"EV-"+(S.evidences.length+1001), agentId:a.id, unitId:a.unitId, shift:iv.shift, opDate:iv.opDate, slotKey:null,
    receivedAt:limaISO(d,s.hour,Math.floor(r()*55)), type:r()<.12?"Video":"Fotografía", gps:r()<.7?"-12.0000, -77.0000 (ejemplo)":"", address:"", status:"Sin asignar", notes:"", telegramRef:"", demo:true };
  if(ev.gps) ev.address="Dirección aproximada de ejemplo"; S.evidences.push(ev); return ev; }
function ensureIntervals(date){ if(isLive()&&(date<LIVE.desde||date>LIVE.hasta)) return; S.agents.filter(a=>a.status==="Activo"&&(!isLive()||!a.start||a.start<=date)).forEach(a=>slotsFor(a.shift).forEach(s=>mkInterval(date,a,s.idx))); }
function persist(){ if(isLive()) return; try{ localStorage.setItem(STATE_KEY, JSON.stringify(S)); }catch(e){ console.warn("No se pudo guardar el estado demo", e); } }
function audit(user,action,record,detail){ if(isLive()) return; S.audit.unshift({id:uid("AU"),at:new Date().toISOString(),user,action,record,detail}); }
const agentById = id => S.agents.find(a=>a.id===id);
const unitById = id => S.units.find(u=>u.id===id);
const fullName = a => a? `${a.first} ${a.last}`: "—";

/* =====================================================================
   4. CAPA DE SERVICIOS (Google Apps Script)
   ---------------------------------------------------------------------
   Notas sobre Apps Script:
   - Publicar como Web App (Ejecutar como: yo / Acceso: según política).
   - Enviar POST con Content-Type "text/plain" para evitar el preflight
     CORS, que Apps Script no responde. El backend parsea e.postData.contents.
   - Apps Script redirige a googleusercontent.com; fetch sigue la redirección.
   - La autorización real (quién puede autorizar descuentos, ver DNI, etc.)
     DEBE validarse en el servidor. Ocultar botones no es seguridad.
   - El token del bot de Telegram vive solo en PropertiesService del backend.
   ===================================================================== */
async function apiCall(action, payload={}){
  if(APP_CONFIG.useDemoData) throw new Error("Modo demostración: no hay conexión con el backend.");
  if(!isValidUrl(APP_CONFIG.googleAppsScriptUrl)) throw new Error("Requiere configuración: falta la URL del despliegue de Google Apps Script.");
  let res;
  try{ res = await fetch(APP_CONFIG.googleAppsScriptUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,payload,auth:SESSION.token||undefined})}); }
  catch(e){ throw new Error("Error de red al contactar Apps Script (revisa publicación, permisos y acceso)."); }
  if(!res.ok) throw new Error(`El servidor respondió ${res.status}.`);
  let data; try{ data = await res.json(); }catch(e){ throw new Error("Respuesta no válida del servidor (se esperaba JSON)."); }
  if(data && data.ok===false){ const er=new Error(data.error||"Error del servidor."); er.authRequired=!!data.authRequired; if(er.authRequired&&action!=="login"){ SESSION.clear(); setTimeout(()=>showLogin(er.message),0); } throw er; }
  return data;
}
const demoDelay = (v,ms=250)=>new Promise(r=>setTimeout(()=>r(v),ms));
async function loadDashboardData(){ if(APP_CONFIG.useDemoData) return demoDelay(S); return apiCall("loadDashboardData",{dias:31}); }
async function loadAgents(){ if(APP_CONFIG.useDemoData) return demoDelay(S.agents,0); return apiCall("loadAgents"); }
async function saveAgent(agent){
  if(APP_CONFIG.useDemoData){ const i=S.agents.findIndex(a=>a.id===agent.id); if(i>=0) S.agents[i]=agent; else S.agents.push(agent); persist(); return demoDelay(agent,150); }
  const isNew=!S.agents.some(x=>x.id===agent.id);
 const r=await apiCall("saveAgent",{agent:{id:isNew?"":agent.id,first:agent.first,last:agent.last,dni:agent.dni,phone:agent.phone,photoUrl:agent.photoUrl,status:agent.status,unitId:agent.unitId,shift:agent.shift,start:agent.start,notes:agent.notes}});
 const i=S.agents.findIndex(x=>x.id===r.agent.id); if(i>=0) S.agents[i]=r.agent; else S.agents.push(r.agent);
 Object.assign(agent,r.agent); return r.agent;
}
async function loadReports(f){ if(APP_CONFIG.useDemoData) return demoDelay(S.evidences,0); return apiCall("loadReports",f); }
async function saveReportReview(review){ if(APP_CONFIG.useDemoData){ persist(); return demoDelay(review,100); } if(!review||!review.key) return {ok:true}; return apiCall("saveReportReview",review); }
async function loadAdministrativeRecords(f){ if(APP_CONFIG.useDemoData) return demoDelay(S.concepts,0); return apiCall("loadAdministrativeRecords",f); }
async function saveAdministrativeRecord(rec){
  if(APP_CONFIG.useDemoData){ const i=S.concepts.findIndex(c=>c.id===rec.id); if(i>=0) S.concepts[i]=rec; else S.concepts.unshift(rec); persist(); return demoDelay(rec,150); }
  return apiCall("saveAdministrativeRecord",{record:rec});
}
async function loadAgentHistory(id){ if(APP_CONFIG.useDemoData) return demoDelay(S.audit.filter(a=>a.record===id),0); return apiCall("loadAgentHistory",{id}); }
async function uploadAgentPhoto(agentId, file){
if(isLive()) throw new Error("La carga de fotos no está disponible en esta etapa: use una URL https.");
  // En producción: enviar base64 a Apps Script → DriveApp.getFolderById(driveFolderId).createFile(...)
  // y guardar en el agente la URL/ID estable devuelto por el servidor.
  if(APP_CONFIG.useDemoData) throw new Error("La subida a Google Drive requiere el backend. En modo demostración la foto es solo una vista previa local.");
  if(!APP_CONFIG.driveFolderId) throw new Error("Requiere configuración: falta el ID de carpeta de Google Drive.");
  const b64 = await new Promise((ok,ko)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=ko; fr.readAsDataURL(file); });
  return apiCall("uploadAgentPhoto",{agentId,name:file.name,mime:file.type,data:b64});
}
async function generateReportExport(opts){ audit(CURRENT_USER,"Exportación generada",opts.agentId||"Todos",`${opts.format.toUpperCase()} · ${opts.mode}`); persist(); return true; }

/* =====================================================================
   5. UI BÁSICA: toasts, modales, confirmación, avatares
   ===================================================================== */
function toast(msg,type="ok"){ const t=document.createElement("div"); t.className=`toast glass ${type}`; t.setAttribute("role","status");
  t.innerHTML = ic(type==="ok"?"check-circle-2":type==="err"?"alert-octagon":"info")+`<div>${esc(msg)}</div>`;
  $("#toasts").appendChild(t); icons(); setTimeout(()=>{t.style.opacity="0";t.style.transition=".3s";setTimeout(()=>t.remove(),300)}, type==="err"?6000:3500); }
function icons(){ try{ window.lucide && lucide.createIcons(); }catch(e){} }
function openModal(title, body, foot="", size=""){
  const m=$("#modal"); m.className="modal glass "+size;
  m.innerHTML=`<div class="modal-h"><h3>${title}</h3><button class="icon-btn" data-act="closeModal" aria-label="Cerrar">${ic("x")}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}`;
  $("#modalOv").classList.add("open"); icons(); setTimeout(()=>{ const f=m.querySelector("input,select,textarea"); f&&f.focus(); },50);
}
function closeModal(){ $("#modalOv").classList.remove("open"); }
function confirmDlg(title,msg,okLabel="Confirmar",danger=false){ return new Promise(res=>{
  const b=$("#confirmBox"); b.innerHTML=`<div class="modal-h"><h3>${esc(title)}</h3></div><div class="modal-b">${msg}</div><div class="modal-f"><button class="btn" id="cfNo">Cancelar</button><button class="btn ${danger?"danger":"primary"}" id="cfOk">${esc(okLabel)}</button></div>`;
  $("#confirmOv").classList.add("open"); const done=v=>{ $("#confirmOv").classList.remove("open"); res(v); };
  $("#cfNo").onclick=()=>done(false); $("#cfOk").onclick=()=>done(true); $("#cfOk").focus(); }); }
function initials(a){ return a? ((a.first||"?")[0]+((a.last||"").split(" ").pop()||"?")[0]).toUpperCase() : "?"; }
function photoOf(a){ return a?.photoLocal || a?.photoUrl || APP_CONFIG.defaultPhotoUrl || ""; }
function avatar(a,cls=""){ const p=photoOf(a); const ini=esc(initials(a));
  return `<span class="avatar ${cls}">${p?`<img src="${esc(p)}" alt="Foto de ${esc(fullName(a))}" onerror="this.parentNode.textContent='${ini}'">`:ini}</span>`; }
function who(a,sub){ return `<div class="who">${avatar(a)}<div><b>${esc(fullName(a))}</b><small>${esc(sub ?? (a?a.id+" · DNI "+a.dni:""))}</small></div></div>`; }

F.inf={kind:"cumplimiento",q:"",unit:"",agent:"",shift:"",from:"",to:"",sort:"",dir:1};
function reportData(){ const f=F.inf; if(!f.from){f.from=addDays(today(),-6); f.to=today();}
  const inR=d=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
  const agOk=a=>a&&(!f.agent||a.id===f.agent)&&(!f.unit||a.unitId===f.unit)&&(!f.shift||a.shift===f.shift);
  if(f.kind==="cumplimiento"){ const cols=["Agente","Unidad","Turno","Intervalos vencidos","Cubiertos","Justificados","Incumplimientos","% cumplimiento"];
    const rows=S.agents.filter(agOk).map(a=>{ const ivs=Object.values(S.intervals).filter(i=>i.agentId===a.id&&inR(i.opDate)&&slotEnd(i)<Date.now()); const cub=ivs.filter(i=>["Recibido","Aceptado"].includes(i.status)).length, j=ivs.filter(i=>i.status==="Justificado").length, inc=ivs.filter(i=>i.status==="Incumplimiento confirmado").length;
      return [fullName(a),unitById(a.unitId)?.name||"",shiftName(a.shift),ivs.length,cub,j,inc,ivs.length?Math.round((cub+j)/ivs.length*100):0]; }); return {cols,rows}; }
  if(f.kind==="justificaciones"){ const cols=["Agente","Fecha operativa","Intervalo","Justificación","Estado","Registrada"];
    return {cols,rows:Object.values(S.intervals).filter(i=>i.justification&&inR(i.opDate)&&agOk(agentById(i.agentId))).map(i=>[fullName(agentById(i.agentId)),fmtDate(i.opDate),slotsFor(i.shift)[i.idx].label,i.justification.text,i.justification.status,fmtDT(i.justification.at)])}; }
  const types = f.kind==="incidencias"?["Incidencia administrativa"]:null;
  const cols=["ID","Agente","Concepto","Fecha","N° doc.","Importe","Estado"];
  return {cols,rows:S.concepts.filter(c=>inR(c.factDate)&&agOk(agentById(c.agentId))&&(!types||types.includes(c.type))&&(f.kind!=="descuentos"||(c.amount>0&&["Autorizado","Pendiente"].includes(c.status)))).map(c=>[c.id,fullName(agentById(c.agentId)),c.type,fmtDate(c.factDate),c.docNo||"—",c.amount>0?+c.amount:"",c.status])};
}

  html(){ const f=F.inf; reportData(); return `<div class="tabs">${[["cumplimiento","Cumplimiento horario"],["justificaciones","Justificaciones"],["incidencias","Incidencias"],["conceptos","Conceptos administrativos"],["descuentos","Descuentos autorizados y pendientes"]].map(([k,l])=>`<button class="tab ${f.kind===k?"active":""}" data-act="setF" data-k="inf.kind" data-val="${k}">${l}</button>`).join("")}</div>
    <div class="glass toolbar"><div class="search">${ic("search")}<input data-f="inf.q" placeholder="Buscar en resultados…" value="${esc(f.q)}"></div><select data-f="inf.unit">${unitOpts(f.unit,"Todas las unidades")}</select><select data-f="inf.agent">${agentOpts(f.agent,"Todos los agentes")}</select><select data-f="inf.shift">${opts([["D","Diurno"],["N","Nocturno"]],f.shift,"Ambos turnos")}</select><input type="date" data-f="inf.from" value="${f.from}"><input type="date" data-f="inf.to" value="${f.to}"><button class="btn" data-act="exportCSV">${ic("sheet")}Exportar CSV</button></div>
    <div id="list">${this.list()}</div>`; },
  list(){ const f=F.inf; let {cols,rows}=reportData(); const q=f.q.toLowerCase(); if(q) rows=rows.filter(r=>r.join(" ").toLowerCase().includes(q));
    if(f.sort!=="") rows.sort((a,b)=>{ const x=a[f.sort],y=b[f.sort]; return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y)))*f.dir; });

    return `<div class="glass table-wrap"><table><thead><tr>${cols.map((c,i)=>`<th data-act="sortInf" data-sort="${i}">${esc(c)} ${+f.sort===i&&f.sort!==""?(f.dir>0?"▲":"▼"):""}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${cols[i]==="Importe"&&v!==""?money(v):cols[i]==="Estado"?cBadge(v):cols[i]==="% cumplimiento"?v+"%":esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="dim" style="font-size:12px">${rows.length} fila(s) · datos de ejemplo</p>`; }
};

async function saveUnit(id){ const name=val("un"); const sh=[$("#ushD").checked&&"D",$("#ushN").checked&&"N"].filter(Boolean);
  setInvalid("w-un",name.length<3?"Ingresa un nombre (mínimo 3 caracteres).":""); setInvalid("w-ush",sh.length?"":"Selecciona al menos un turno."); if(name.length<3||!sh.length) return;
if(isLive()){ try{ const prev=id?unitById(id):null; const r=await apiCall("saveUnit",{unit:{id:id||"",code:prev?.code||"",name,address:val("ua"),supervisor:val("us"),active:val("ust")==="1",shifts:sh,notes:val("uo")}}); const i=S.units.findIndex(x=>x.id===r.unit.id); if(i>=0) S.units[i]=r.unit; else S.units.push(r.unit); closeModal(); toast("Unidad guardada."); render(); }catch(e){ toast("No se pudo guardar: "+e.message,"err"); } return; }
const u = id?unitById(id):{id:"U-"+pad(S.units.length+1).padStart(3,"0")}; Object.assign(u,{name,address:val("ua"),supervisor:val("us"),active:val("ust")==="1",shifts:sh,notes:val("uo")});
  if(!id) S.units.push(u); audit(CURRENT_USER,id?"Unidad editada":"Unidad registrada",u.id,u.name); persist(); closeModal(); toast("Unidad guardada (demostración)."); render(); }

    <div class="field" id="w-ap"><label for="ap">Teléfono (opcional)</label><input id="ap" inputmode="tel" value="${esc(a.phone)}"><span class="err"></span></div>

async function saveAgentBtn(id){

// --- Casos / intervalos
function openCase(key){ const iv=S.intervals[key]; if(!iv) return; const a=agentById(iv.agentId); const s=slotsFor(iv.shift)[iv.idx];
  const ev=iv.evidenceId&&S.evidences.find(e=>e.id===iv.evidenceId);
  const avail=S.evidences.filter(e=>!e.slotKey&&e.agentId===iv.agentId);
  const pendIvs=Object.values(S.intervals).filter(x=>x.agentId===iv.agentId&&x.key!==key&&!x.evidenceId&&["Pendiente","En revisión"].includes(x.status));
  openModal("Revisión de intervalo",`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${avatar(a,"lg")}<div><h3>${esc(fullName(a))}</h3><div class="muted">${esc(unitById(iv.unitId)?.name)} · ${shiftName(iv.shift)}</div><div style="margin-top:6px">${ivBadge(iv.status)}</div></div></div>
    <dl class="kv"><dt>Fecha operativa</dt><dd>${fmtDate(iv.opDate)}</dd><dt>Intervalo</dt><dd>${s.label}${s.nextDay?' <span class="dim">(día siguiente)</span>':""}</dd>
    <dt>Evidencia</dt><dd>${ev?`${ev.id} · ${ev.type} · recibida <b>${fmtDT(ev.receivedAt)}</b> <span class="demo-tag">Demo</span>`:'<span class="dim">Sin evidencia asignada</span>'}</dd>
    <dt>Justificación</dt><dd>${iv.justification?`${esc(iv.justification.text)} ${cBadge(iv.justification.status)}`:'<span class="dim">Ninguna</span>'}</dd></dl>
    ${avail.length&&!ev?`<div class="sec-title"><h2 style="font-size:14px">Evidencias disponibles del agente (sin asignar)</h2></div>${avail.map(e=>`<div class="list-item">${ic(e.type==="Video"?"video":"image")}<div style="flex:1">${e.id} · recibida ${fmtDT(e.receivedAt)}</div><button class="btn sm" data-act="caseAssign" data-k="${esc(key)}" data-e="${e.id}">Asignar aquí</button></div>`).join("")}`:""}
    ${ev&&pendIvs.length?`<div class="field" style="margin-top:12px"><label>Mover evidencia a otro intervalo pendiente</label><div style="display:flex;gap:8px"><select id="mvTo">${pendIvs.slice(0,40).map(x=>`<option value="${esc(x.key)}">${fmtDate(x.opDate)} · ${slotsFor(x.shift)[x.idx].label}</option>`).join("")}</select><button class="btn sm" data-act="caseMove" data-k="${esc(key)}">Mover</button></div></div>`:""}
    <div class="field" style="margin-top:12px"><label for="cjust">Registrar justificación presentada</label><textarea id="cjust" placeholder="Texto de la justificación…"></textarea><button class="btn sm" style="align-self:flex-start" data-act="caseJust" data-k="${esc(key)}">Registrar justificación</button></div>
    <div class="field" style="margin-top:12px"><label for="cobs">Observación del supervisor</label><textarea id="cobs"></textarea><button class="btn sm" style="align-self:flex-start" data-act="caseObs" data-k="${esc(key)}">Añadir observación</button></div>
    <div class="sec-title"><h2 style="font-size:14px">Historial de decisiones</h2></div>${(iv.history.concat(iv.notes.map(n=>({at:n.at,by:n.by,text:"Observación: "+n.text})))).sort((x,y)=>y.at.localeCompare(x.at)).map(h=>`<div class="list-item"><span class="dot" style="background:var(--muted);box-shadow:none"></span><div>${esc(h.text)}<br><small class="dim">${fmtDT(h.at)} · ${esc(h.by)}</small></div></div>`).join("")||'<p class="dim">Sin decisiones registradas.</p>'}`,
    `${ev?`<button class="btn ok" data-act="caseDo" data-k="${esc(key)}" data-do="accept">Aceptar evidencia</button>`:""}
     ${iv.justification?.status==="Pendiente"?`<button class="btn ok" data-act="caseDo" data-k="${esc(key)}" data-do="approve">Aprobar justificación</button><button class="btn danger" data-act="caseDo" data-k="${esc(key)}" data-do="reject">Rechazar justificación</button>`:""}
     <button class="btn" data-act="caseDo" data-k="${esc(key)}" data-do="keep">Mantener pendiente</button>
     <button class="btn danger" data-act="caseDo" data-k="${esc(key)}" data-do="confirm">Confirmar incumplimiento</button>`,"lg"); liveTrimCase(); }
async function doAssign(ev,iv){
  if(ev.slotKey) throw new Error(`La evidencia ${ev.id} ya está asignada a otro intervalo.`);
  if(iv.evidenceId) throw new Error("El intervalo ya tiene una evidencia asignada.");
  if(isLive()){ const r=await apiCall("assignEvidence",{evidenceId:ev.id,key:iv.key}); Object.assign(ev,r.evidence); iv.evidenceId=ev.id; if(iv.status==="Pendiente") iv.status="Recibido"; return; }
  assignEvidence(ev,iv);
}
function liveTrimCase(){ if(!isLive()) return;
  ["#cjust","#cobs"].forEach(s=>{ const el=$(s); if(el) el.closest(".field").style.display="none"; });
  $$('#modal [data-do="approve"],#modal [data-do="reject"],#modal [data-do="confirm"]').forEach(b=>b.style.display="none");
  const kb=$('#modal [data-do="keep"]'); const iv=S.intervals[kb?.dataset.k]; if(kb&&iv&&!iv.evidenceId) kb.style.display="none"; }
function ivLog(iv,text){ iv.history.push({at:new Date().toISOString(),by:CURRENT_USER,text}); audit(CURRENT_USER,text,iv.agentId,`${fmtDate(iv.opDate)} ${slotsFor(iv.shift)[iv.idx].label}`); }
function assignEvidence(ev,iv){ if(ev.slotKey) throw new Error(`La evidencia ${ev.id} ya está asignada a otro intervalo.`); if(iv.evidenceId) throw new Error("El intervalo ya tiene una evidencia asignada.");
  ev.slotKey=iv.key; ev.status="Asignada"; iv.evidenceId=ev.id; if(iv.status==="Pendiente") iv.status="Recibido"; // receivedAt se conserva intacto
  ivLog(iv,`Evidencia ${ev.id} asignada (recibida ${fmtDT(ev.receivedAt)})`); }
async function caseDo(key,what){ const iv=S.intervals[key]; const L={accept:["Aceptar evidencia","El intervalo quedará como Aceptado."],approve:["Aprobar justificación","El intervalo quedará Justificado y no generará descuento."],reject:["Rechazar justificación","La justificación quedará rechazada."],keep:["Mantener pendiente","El caso seguirá abierto."],confirm:["Confirmar incumplimiento","Se registrará el incumplimiento. No se generará ningún descuento automático."]}[what];
  if(!await confirmDlg(L[0],`<p>${L[1]}</p>`,L[0],what==="confirm"||what==="reject")) return;
if(isLive()){ if(!["accept","keep"].includes(what)) return toast("Acción no disponible en el control de reportes.","info"); try{ await saveReportReview({key,action:what}); }catch(e){ return toast(e.message,"err"); } }
  if(what==="accept"){ iv.status="Aceptado"; const e=S.evidences.find(x=>x.id===iv.evidenceId); if(e) e.status="Aceptada"; }
  if(what==="approve"){ iv.justification.status="Aprobada"; iv.status="Justificado"; }
  if(what==="reject"){ iv.justification.status="Rechazada"; if(iv.status==="Justificado") iv.status="Pendiente"; }
  if(what==="keep"){ iv.status = iv.evidenceId?"En revisión":"Pendiente"; }
  if(what==="confirm"){ iv.status="Incumplimiento confirmado"; }
  ivLog(iv,L[0]); if(!isLive()) await saveReportReview({key,action:what}); closeModal(); toast(L[0]+" registrado."); render();
  if(what==="confirm" && await confirmDlg("¿Registrar concepto administrativo?","<p>Puedes registrar una <b>Falta de reporte por hora</b> en estado Pendiente y sin importe. La autorización se hará por separado.</p>","Registrar concepto")) newConcept({type:"Falta de reporte por hora",agentId:iv.agentId,factDate:iv.opDate,desc:`Intervalo ${slotsFor(iv.shift)[iv.idx].label} sin reporte.`}); }

// --- Asignación por lote
function assignSelected(){ const sel=F.evid.sel.map(id=>S.evidences.find(e=>e.id===id)).filter(e=>e&&!e.slotKey); if(!sel.length) return;
  const rows=sel.map(e=>{ const piv=Object.values(S.intervals).filter(i=>i.agentId===e.agentId&&!i.evidenceId&&["Pendiente","En revisión"].includes(i.status)).sort((x,y)=>y.opDate.localeCompare(x.opDate)||x.idx-y.idx).slice(0,36);
    return `<tr><td>${who(agentById(e.agentId),e.id)}</td><td>${fmtDT(e.receivedAt)}</td><td><select data-asg="${e.id}"><option value="">— Elegir intervalo —</option>${piv.map(i=>`<option value="${esc(i.key)}">${fmtDate(i.opDate)} · ${slotsFor(i.shift)[i.idx].label}</option>`).join("")}</select></td></tr>`; }).join("");
  openModal(`Asignar ${sel.length} evidencia(s) a intervalos`,`<p class="muted">Cada evidencia solo puede cubrir un intervalo. La hora real de recepción se conserva aunque se asigne a una hora anterior.</p><div class="table-wrap"><table><thead><tr><th>Evidencia</th><th>Recibida</th><th>Intervalo pendiente</th></tr></thead><tbody>${rows}</tbody></table></div><div class="notice red" id="asgErr" style="display:none;margin-top:10px"></div>`,
    `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="confirmAssign">Confirmar asignación</button>`,"lg"); }
async function confirmAssign(){ const picks=$$("[data-asg]").map(s=>({e:s.dataset.asg,k:s.value})); const err=$("#asgErr");
  const chosen=picks.filter(p=>p.k); const keys=chosen.map(p=>p.k);
  if(!chosen.length){ err.style.display="flex"; err.textContent="Selecciona al menos un intervalo."; return; }
  if(new Set(keys).size!==keys.length){ err.style.display="flex"; err.textContent="No puedes asignar dos evidencias al mismo intervalo."; return; }
  if(!await confirmDlg("Confirmar asignación",`<p>Se asignarán ${chosen.length} evidencia(s). Esta acción quedará en el historial.</p>`)) return;
  try{ for(const p of chosen) await doAssign(S.evidences.find(e=>e.id===p.e),S.intervals[p.k]); }catch(e){ F.evid.sel=[]; render(); return toast(e.message,"err"); }
  F.evid.sel=[]; await saveReportReview({batch:chosen}); closeModal(); toast(`${chosen.length} evidencia(s) asignada(s).`); render(); }

function docPhoto(a,show){ if(!show) return ""; const p=photoOf(a); return `<div class="ph">${p?`<img src="${esc(p)}" crossorigin="anonymous" alt="">`:esc(initials(a))}</div>`; }
function docHead(title){ return `<div class="dh"><div><div class="tag">${esc(APP_CONFIG.appName)}</div><h1>${esc(title)}</h1></div><div style="text-align:right;font-size:10px;color:#666">Generado: ${fmtDT(new Date().toISOString())}<br>${APP_CONFIG.useDemoData?'<span class="demo">DOCUMENTO DE DEMOSTRACIÓN · DATOS FICTICIOS</span>':""}</div></div>`; }
function agentBlock(a,o){ return `<div class="agent">${docPhoto(a,o.photos)}<div><b style="font-size:15px">${esc(fullName(a))}</b><br>${o.dni?"DNI: "+esc(a.dni)+" · ":""}ID: ${a.id}<br>Unidad: ${esc(unitById(a.unitId)?.name)} · Turno: ${shiftName(a.shift)}</div></div>`; }
function signs(o,labels){ return o.signs?`<div class="sign">${labels.map(l=>`<div>${l}</div>`).join("")}</div>`:""; }
function singleDoc(c,o){ const a=agentById(c.agentId);
  return { name:`${slugify(c.type)}_${slugify(fullName(a))}_${c.id}`, html:`<div class="doc">${docHead(c.type+(c.docNo?" N° "+c.docNo:""))}${agentBlock(a,o)}

    ${signs(o,["Agente","Supervisor","Administración"])}<div class="foot">Documento generado desde ${esc(APP_CONFIG.appName)}.</div></div>` }; }
function summaryDoc(a,list,o){ const valid=list.filter(c=>["Autorizado","Pendiente"].includes(c.status)), out=list.filter(c=>["Rechazado","Anulado"].includes(c.status)); const t=totals(list);
  const tbl=l=>l.length?`<table><thead><tr><th>Fecha</th><th>Concepto</th><th>N° doc.</th><th>Descripción</th><th>Importe</th><th>Estado</th></tr></thead><tbody>${l.map(c=>`<tr><td>${fmtDate(c.factDate)}</td><td>${esc(c.type)}</td><td>${esc(c.docNo||"—")}</td><td>${esc(c.desc)}</td><td>${c.amount>0?money(c.amount):"—"}</td><td>${esc(c.status)}</td></tr>`).join("")}</tbody></table>`:`<p style="color:#888">Sin registros.</p>`;
  return { name:`Resumen_${slugify(fullName(a))}_${o.from}_${o.to}`, html:`<div class="doc">${docHead("Resumen de conceptos administrativos")}${agentBlock(a,o)}<p>Período consultado: <b>${fmtDate(o.from)}</b> al <b>${fmtDate(o.to)}</b>${o.type?" · Concepto: "+esc(o.type):""}</p>
    <div class="tot"><div>Total autorizado<b>${money(t.auth)}</b></div><div>Total pendiente<b>${money(t.pend)}</b></div><div>Registros<b>${list.length}</b></div></div>
    <h3>Conceptos registrados</h3>${tbl(valid)}${o.scope==="all"?`<h3>Rechazados o anulados (no suman)</h3>${tbl(out)}`:""}
    <h3>Observaciones</h3><p style="color:#444">Los conceptos sin importe no se cuentan como dinero descontado. Los rechazados o anulados no se consideran descuentos autorizados.</p>
    ${signs(o,["Agente","Supervisor","Administración"])}<div class="foot">Generado: ${fmtDT(new Date().toISOString())} · ${esc(APP_CONFIG.appName)}</div></div>` }; }
function buildDocs(o){ let list=S.concepts.filter(c=>(!o.agent||c.agentId===o.agent)&&(!o.type||c.type===o.type)&&(!o.from||c.factDate>=o.from)&&(!o.to||c.factDate<=o.to)&&(o.scope==="all"||c.status==="Autorizado"));
  if(o.mode==="individual") return list.map(c=>singleDoc(c,o));
  const ids=o.agent?[o.agent]:[...new Set(list.map(c=>c.agentId))]; return ids.map(id=>summaryDoc(agentById(id),list.filter(c=>c.agentId===id),o)); }
async function renderDocsToFile(docs,fmt,baseName){
  if(!docs.length) return toast("No hay registros con los filtros seleccionados.","err");
  if(!window.html2canvas||(fmt==="pdf"&&!window.jspdf)) return toast("No se pudieron cargar las bibliotecas de exportación (revisa tu conexión).","err");
  const stage=$("#exportStage"); toast("Generando documento…","info");
  try{
    let pdf=null;
    for(let i=0;i<docs.length;i++){
      stage.innerHTML=docs[i].html; await new Promise(r=>setTimeout(r,60));
      await Promise.all($$("img",stage).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
      const canvas=await html2canvas(stage.firstElementChild,{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false});
      if(fmt==="png"){ const url=canvas.toDataURL("image/png"); const a=document.createElement("a"); a.href=url; a.download=docs[i].name+".png"; document.body.appendChild(a); a.click(); a.remove(); if(docs.length>1) await new Promise(r=>setTimeout(r,400)); }
      else { const {jsPDF}=window.jspdf; if(!pdf) pdf=new jsPDF({unit:"pt",format:"a4"}); else pdf.addPage();
        const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const ratio=pw/canvas.width; const pageH=Math.floor(ph/ratio);
        for(let y=0,first=true;y<canvas.height;y+=pageH,first=false){ if(!first) pdf.addPage(); const c2=document.createElement("canvas"); c2.width=canvas.width; c2.height=Math.min(pageH,canvas.height-y); c2.getContext("2d").drawImage(canvas,0,-y); pdf.addImage(c2.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,c2.height*ratio); } }
    }
    if(pdf) pdf.save((docs.length===1?docs[0].name:baseName)+".pdf");
    stage.innerHTML=""; toast(fmt==="pdf"?"PDF generado.":`${docs.length} imagen(es) PNG generada(s).`);
  }catch(e){ stage.innerHTML=""; console.error(e); toast("Error al generar el archivo: "+(e.message||"desconocido")+". Si usas fotos externas, el servidor debe permitir CORS.","err"); }
}
async function doExport(fmt){ const o=F.exp; if(o.from&&o.to&&o.from>o.to) return toast("La fecha inicial no puede ser posterior a la final.","err");
  const docs=buildDocs(o); if(fmt==="png"&&docs.length>10&&!await confirmDlg("Muchas imágenes",`<p>Se descargarán ${docs.length} archivos PNG. ¿Continuar?</p>`)) return;
  await renderDocsToFile(docs,fmt,`Resumen_${o.agent?slugify(fullName(agentById(o.agent))):"Todos"}_${o.from}_${o.to}`);
  await generateReportExport({format:fmt,mode:o.mode,agentId:o.agent}); }

  calMove:d=>{ const [y,m]=F.cal.month.split("-").map(Number); const t=new Date(Date.UTC(y,m-1+(+d.d),1)); F.cal.month=t.toISOString().slice(0,7); render(); },
  newCal:(d,el,e)=>{ if(e.target.closest("[data-act=editCal]")) return; editCal(null,d.date); }, editCal:(d,el,e)=>{ e.stopPropagation(); editCal(d.id); }, saveCal:d=>saveCal(d.id),
  delCal:async d=>{ if(!await confirmDlg("Eliminar evento","<p>Se eliminará este registro del calendario.</p>","Eliminar",true)) return; S.calendar=S.calendar.filter(c=>c.id!==d.id); audit(CURRENT_USER,"Evento de calendario eliminado",d.id,""); persist(); closeModal(); render(); },
  sortInf:d=>{ const i=+d.sort; if(F.inf.sort===i) F.inf.dir*=-1; else { F.inf.sort=i; F.inf.dir=1; } relist(); },
  exportCSV:()=>{ const r=window.__report; if(!r||!r.rows.length) return toast("No hay filas para exportar.","err"); const csv=[r.cols].concat(r.rows).map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"})); a.download=`Informe_${F.inf.kind}_${F.inf.from}_${F.inf.to}.csv`; a.click(); audit(CURRENT_USER,"Exportación CSV",F.inf.kind,`${r.rows.length} filas`); persist(); toast("CSV descargado."); },
  bgPreview:()=>{ const u=val("bgUrl"); const p=$("#bgPrev"); if(!u){ setInvalid("fw-bg","Ingresa una URL."); return; } if(!isValidUrl(u)){ setInvalid("fw-bg","URL no válida (http:// o https://)."); return; }
    p.textContent="Cargando…"; const img=new Image(); img.onload=()=>{ setInvalid("fw-bg",""); p.textContent=""; p.style.backgroundImage=`url("${u.replace(/"/g,"%22")}")`; }; img.onerror=()=>{ setInvalid("fw-bg","No se pudo cargar la imagen desde esa URL."); p.textContent="Error al cargar"; p.style.backgroundImage=""; }; img.src=u; },
  bgApply:()=>{ const u=val("bgUrl"); if(u&&!isValidUrl(u)) return setInvalid("fw-bg","URL no válida.");
    if(!u){ APP_CONFIG.backgroundImageUrl=""; applyBg(); saveConfigLocal(); return toast("Fondo de reserva aplicado."); }
    const img=new Image(); img.onload=()=>{ APP_CONFIG.backgroundImageUrl=u; applyBg(); saveConfigLocal(); audit(CURRENT_USER,"Cambio de configuración","Fondo","Imagen de fondo actualizada"); persist(); toast("Fondo aplicado."); }; img.onerror=()=>{ setInvalid("fw-bg","No se pudo cargar la imagen. No se aplicó."); toast("No se pudo cargar la imagen de fondo.","err"); }; img.src=u; },
  bgClear:()=>{ APP_CONFIG.backgroundImageUrl=""; applyBg(); saveConfigLocal(); render(); toast("Fondo de reserva aplicado."); },
  saveCfg:()=>{ let bad=false; $$("[data-cfg]").forEach(el=>{ const k=el.dataset.cfg; const v=el.type==="checkbox"?el.checked:el.value.trim();
      if(["googleAppsScriptUrl","defaultPhotoUrl"].includes(k)&&v&&!isValidUrl(v)){ setInvalid("fw-"+k,"URL no válida."); bad=true; return; } if(k==="telegramBotUsername"&&v&&!/^@?[A-Za-z0-9_]{4,32}$/.test(v)){ setInvalid("fw-"+k,"Solo el nombre de usuario (sin token)."); bad=true; return; }
      if(/^\d{6,}:[A-Za-z0-9_-]{20,}$/.test(String(v))){ setInvalid("fw-"+k,"Parece un token de bot. No lo guardes aquí."); bad=true; return; }
      setInvalid("fw-"+k,""); APP_CONFIG[k]=k==="telegramBotUsername"?String(v).replace(/^@/,""):v; });
    $$("[data-shift]").forEach(el=>{ const h=Math.max(0,Math.min(23,parseInt(el.value)||0)); APP_CONFIG.shifts[el.dataset.shift].start=h; });
    if(bad) return toast("Revisa los campos marcados.","err");
    if(!APP_CONFIG.useDemoData&&!APP_CONFIG.googleAppsScriptUrl){ APP_CONFIG.useDemoData=true; toast("Sin URL de Apps Script no se puede desactivar el modo demostración.","err"); }
    saveConfigLocal(); audit(CURRENT_USER,"Cambio de configuración","APP_CONFIG","Configuración guardada"); persist(); toast("Configuración guardada en este navegador."); render(); },
  testConn:async()=>{ try{ await apiCall("ping"); toast("Conexión con Apps Script correcta."); }catch(e){ toast(e.message,"err"); } },
  resetDemo:async()=>{ if(!await confirmDlg("Restablecer datos demo","<p>Se borrarán los cambios locales y se regenerarán los datos ficticios.</p>","Restablecer",true)) return; localStorage.removeItem(STATE_KEY); seedDemo(); persist(); toast("Datos de demostración regenerados."); render(); }
};
ACT.doLogin=async()=>{ const u=val("lu"), p=($("#lp")||{}).value||""; if(!u||!p) return toast("Escribe usuario y clave.","err");
  try{ const r=await apiCall("login",{usuario:u,clave:p}); SESSION.set(r.token,r.nombre,r.rol); $("#lp").value=""; await loadLive(); }catch(e){ toast(e.message,"err"); } };
ACT.logout=async()=>{ try{ await apiCall("logout"); }catch(e){} SESSION.clear(); S=null; showLogin(); };
ACT.reload=()=>loadLive();
ACT.retryLoad=()=>{ SESSION.token?loadLive():showLogin(); };
["newConcept","editConcept","saveConcept","conceptDetail","cStatus","exportOne","doExport","calMove","newCal","editCal","saveCal","delCal","caseJust","caseObs","resetDemo","exportCSV"].forEach(k=>{ const f=ACT[k]; ACT[k]=(...a)=>{ if(isLive()){ toast("Función no disponible en el control de reportes.","info"); return; } return f(...a); }; });
{ const _tu=ACT.toggleUnit; ACT.toggleUnit=async d=>{ if(!isLive()) return _tu(d); const u=unitById(d.id); if(!await confirmDlg(u.active?"Desactivar unidad":"Activar unidad",`<p>${esc(u.name)}</p>`,"Confirmar",u.active)) return;
  try{ const r=await apiCall("saveUnit",{unit:{id:u.id,code:u.code||"",name:u.name,address:u.address,supervisor:u.supervisor,active:!u.active,shifts:u.shifts,notes:u.notes}}); Object.assign(u,r.unit); toast("Estado de unidad actualizado."); render(); }catch(e){ toast(e.message,"err"); } }; }
{ const _cm=ACT.caseMove; ACT.caseMove=async d=>{ if(!isLive()) return _cm(d); const from=S.intervals[d.k], to=S.intervals[$("#mvTo").value]; const ev=S.evidences.find(e=>e.id===from.evidenceId); if(!to||!ev) return;
  if(!await confirmDlg("Mover evidencia",`<p>${ev.id} pasará al intervalo ${fmtDate(to.opDate)} ${slotsFor(to.shift)[to.idx].label}.</p>`)) return;
  try{ await apiCall("assignEvidence",{evidenceId:ev.id,key:null}); }catch(e){ return toast(e.message,"err"); }
  from.evidenceId=null; from.status="Pendiente"; ev.slotKey=null; ev.status="Sin asignar";
  try{ await doAssign(ev,to); }catch(e){ render(); return toast("Se retiró de la franja anterior pero no se pudo asignar a la nueva: "+e.message,"err"); }
  toast("Evidencia reasignada."); openCase(to.key); }; }
{ const _sc=ACT.saveCfg; ACT.saveCfg=()=>{ const prev=APP_CONFIG.useDemoData; _sc(); if(prev!==APP_CONFIG.useDemoData) setTimeout(()=>location.reload(),600); }; }
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target&&e.target.id==="lp") ACT.doLogin(); });
document.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; if(el.tagName==="INPUT"&&el.type==="checkbox"&&el.dataset.act!=="toggleSel") return; const fn=ACT[el.dataset.act]; if(fn){ if(el.tagName!=="INPUT") e.preventDefault(); fn(el.dataset,el,e); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#confirmOv").classList.contains("open")) return; closeModal(); } if(e.key==="Enter"&&e.target.matches(".stat,.day")) e.target.click(); });
function onFilter(e){ const el=e.target.closest("[data-f]"); if(!el) return; const [v,k]=el.dataset.f.split("."); F[v][k]=el.type==="checkbox"?el.checked:el.value;
  if(v==="control"&&k==="date"){ render(); return; } if(v==="evid") F.evid.sel=[]; relist(); }
document.addEventListener("input",e=>{ if(e.target.matches("input[type=text],input:not([type]),input[type=search]")) onFilter(e); });
document.addEventListener("change",e=>{ if(!e.target.matches("input[type=text],input:not([type])")) onFilter(e); });
$("#modalOv").addEventListener("click",e=>{ if(e.target.id==="modalOv") closeModal(); });

function applyBg(){ const u=APP_CONFIG.backgroundImageUrl; document.body.classList.toggle("has-bg",!!u); document.documentElement.style.setProperty("--bg-url", u&&isValidUrl(u)?`url("${u.replace(/"/g,"%22")}")`:"none"); }

   11. ARRANQUE
   ===================================================================== */
function showLogin(msg){ closeModal(); $("#sidebar").innerHTML=""; $("#mobileNav").innerHTML=""; $("#viewTitle").textContent="Acceso"; $("#viewSub").textContent="";
  $("#view").innerHTML=`<div class="glass live-login"><h2 style="margin-bottom:12px">Acceso de supervisor</h2>${msg?`<div class="notice red" style="margin-bottom:12px">${esc(msg)}</div>`:""}<div class="field" id="w-lu"><label for="lu">Usuario</label><input id="lu" autocomplete="username" autocapitalize="none"></div><div class="field" style="margin-top:10px"><label for="lp">Clave</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn primary" data-act="doLogin" style="margin-top:14px;width:100%">Entrar</button></div>`; }
function showFatal(m){ $("#view").innerHTML=`<div class="glass live-login" style="max-width:520px"><h2 style="margin-bottom:8px">No se pudo cargar</h2><p class="muted">${esc(m)}</p><button class="btn primary" data-act="retryLoad" style="margin-top:12px">Reintentar</button></div>`; }
function liveState(d){
  const c=d.config||{};
  if(c.shifts) Object.keys(c.shifts).forEach(k=>{ if(APP_CONFIG.shifts[k]){ APP_CONFIG.shifts[k].start=c.shifts[k].start; APP_CONFIG.shifts[k].count=c.shifts[k].count; } });
  LIVE.desde=d.desde; LIVE.hasta=d.hasta;
  S={units:d.units||[],agents:d.agents||[],intervals:{},evidences:d.evidences||[],concepts:[],calendar:[],docs:[],audit:d.audit||[]};
  for(let day=d.desde; day<=d.hasta; day=addDays(day,1)) ensureIntervals(day);
  S.evidences.forEach(ev=>{ if(!ev.slotKey) return; let iv=S.intervals[ev.slotKey];
    if(!iv){ const a=agentById(ev.agentId); if(!a) return; const m=ev.slotKey.split("|"); iv=mkInterval(m[0],a,+m[2]); }
    iv.evidenceId=ev.id; iv.status=ev.review==="Aceptado"?"Aceptado":(ev.review==="En revisión"?"En revisión":"Recibido"); });
}
async function loadLive(){
  $("#view").innerHTML=`<div class="loading"><div class="spin"></div>Cargando datos…</div>`;
  try{ const d=await loadDashboardData(); liveState(d); CURRENT_USER=SESSION.name||CURRENT_USER; render(); }
  catch(e){ if(e.authRequired) return; showFatal(e.message); }
}
(async function boot(){
$("#view").innerHTML=`<div class="loading"><div class="spin"></div>Cargando datos…</div>`; applyBg();
document.body.classList.toggle("live",isLive());
if(isLive()){
  if(!isValidUrl(APP_CONFIG.googleAppsScriptUrl)){ showFatal("Falta la URL del despliegue de Apps Script (googleAppsScriptUrl)."); return; }
  if(!SESSION.token){ showLogin(); return; }
  await loadLive(); return;
}
try{ const saved=JSON.parse(localStorage.getItem(STATE_KEY)||"null"); if(saved&&saved.agents) S=saved; }catch(e){}
if(!S){ seedDemo(); persist(); }
render();
})();
</script>
